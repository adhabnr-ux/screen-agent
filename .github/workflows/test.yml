# Runs each agent against test/mock_api.py on a real machine of each OS. No API key needed.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell.exe, pwsh.exe] # Windows PowerShell 5.1 and PowerShell 7
    env:
      SCREEN_AGENT_BASE_URL: http://127.0.0.1:8765
      ANTHROPIC_API_KEY: sk-test-good
      SCREEN_AGENT_TASK: test
      MOCK_REPORT: ${{ github.workspace }}\mock_report.json
    steps:
      - uses: actions/checkout@v5
      - name: Start mock API and file server
        shell: pwsh
        run: |
          Start-Process python -ArgumentList 'test/mock_api.py','--port','8765' -WindowStyle Hidden
          Start-Process python -ArgumentList '-m','http.server','8790','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Sleep 3
      - name: Move the cursor off the stop corner
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 400, 300
      - name: Run agent (real screen capture and SendInput)
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); & ([scriptblock]::Create((Get-Content -Raw windows/agent.ps1)))'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check mock report
        shell: pwsh
        run: python test/check_report.py $env:MOCK_REPORT
      - name: Launcher opens a new window that completes the task
        shell: pwsh
        env:
          SCREEN_AGENT_REPO_RAW: http://127.0.0.1:8790
          MOCK_REPORT: ${{ github.workspace }}\mock_report2.json
        run: |
          Start-Process python -ArgumentList 'test/mock_api.py','--port','8766' -WindowStyle Hidden
          Start-Sleep 2
          $env:SCREEN_AGENT_BASE_URL = 'http://127.0.0.1:8766'
          & ${{ matrix.shell }} -NoProfile -Command 'irm http://127.0.0.1:8790/windows/run.ps1 | iex'
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path $env:MOCK_REPORT) -and ((Get-Content -Raw $env:MOCK_REPORT) -match '"done": true')) { break }
            Start-Sleep 1
          }
          python test/check_report.py $env:MOCK_REPORT

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build test image (Xvfb + python3 + libXtst)
        run: docker build -t screen-agent-linux-test -f test/linux_Dockerfile test
      - name: Run Linux tests (real XTest input on a virtual display)
        run: docker run --rm -v "$PWD":/src:ro screen-agent-linux-test bash /src/test/linux_test.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SCREEN_AGENT_BASE_URL: http://127.0.0.1:8765
      ANTHROPIC_API_KEY: sk-test-good
      SCREEN_AGENT_TASK: test
      SCREEN_AGENT_DRY_RUN: '1'      # CI can't grant Accessibility; input events are tested locally
      SCREEN_AGENT_SKIP_PERMS: '1'
      SCREEN_AGENT_REPO_RAW: http://127.0.0.1:8790
      MOCK_REPORT: ${{ github.workspace }}/mock_report.json
    steps:
      - uses: actions/checkout@v5
      - name: Start mock API and file server
        run: |
          python3 test/mock_api.py --port 8765 &
          python3 -m http.server 8790 --bind 127.0.0.1 &
          sleep 3
      - name: Run launcher and agent (curl | bash --here)
        run: script -q /dev/null bash -c 'curl -fsSL $SCREEN_AGENT_REPO_RAW/run.sh | bash -s -- --here'
      - name: Check mock report
        run: python3 test/check_report.py "$MOCK_REPORT"
